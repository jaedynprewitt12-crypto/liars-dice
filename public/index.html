<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liar's Dice — Multiplayer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="app">
  <header>
    <h1>LIAR'S DICE</h1>
    <p>Multiplayer • 2–6 players</p>
  </header>

  <section id="login" class="panel">
    <h2>Join the game</h2>
    <input id="name" maxlength="20" placeholder="Your name">
    <div class="row">
      <button id="create">Create Room</button>
      <button id="showJoin" class="secondary">Join Room</button>
    </div>
    <div id="joinBox" hidden>
      <input id="roomCode" maxlength="5" placeholder="Room code">
      <button id="join">Join</button>
    </div>
    <p id="error" class="error"></p>
  </section>

  <section id="game" hidden>
    <div class="topbar">
      <div>Room: <strong id="code"></strong></div>
      <div id="phaseLabel"></div>
    </div>

    <section id="lobby" class="panel" hidden>
      <h2>Waiting for players</h2>
      <div id="lobbyPlayers"></div>
      <button id="start" hidden>Start Game</button>
    </section>

    <section id="play" hidden>
      <div class="panel">
        <div class="turn" id="message"></div>
        <div class="diceTitle">Your dice</div>
        <div id="myDice" class="dice"></div>
      </div>

      <div class="panel">
        <h2>Players</h2>
        <div id="players"></div>
      </div>

      <div class="panel">
        <h2>Current bid</h2>
        <div id="bid" class="bigBid">No bid yet</div>
        <div id="controls">
          <div class="bidInputs">
            <input id="qty" type="number" min="1" value="1">
            <select id="face">
              <option value="1">Ones</option>
              <option value="2">Twos</option>
              <option value="3">Threes</option>
              <option value="4">Fours</option>
              <option value="5">Fives</option>
              <option value="6">Sixes</option>
            </select>
          </div>
          <button id="bidBtn">Make Bid</button>
          <button id="liarBtn" class="danger">CALL LIAR</button>
        </div>
      </div>

      <div id="result" class="panel result" hidden></div>
    </section>

    <section id="gameOver" class="panel" hidden>
      <h2 id="winner"></h2>
      <button id="restart">Play Again</button>
    </section>
  </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
